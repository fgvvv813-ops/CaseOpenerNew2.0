name: Build Android APK
on:
  push:
    branches: [main, design/landscape-only-014]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Read app version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '\r')
          test -n "$VERSION" || { echo "appVersionName is required"; exit 1; }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"
      - name: Check push configuration
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [[ -z "$FIREBASE_PROJECT_ID" || -z "$FIREBASE_SENDER_ID" || -z "$FIREBASE_APPLICATION_ID" || -z "$FIREBASE_API_KEY" ]]; then
            echo "::warning::Firebase config missing: APK will build but terminated-app push cannot work."
            echo "⚠️ FCM не настроен: push при закрытой игре будет недоступен." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Android Firebase client config is present." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build debug APK
        env:
          GAME_API_BASE: ${{ vars.GAME_API_BASE }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "CaseOpener-New-2.0-v${APP_VERSION}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseOpener-v${{ env.APP_VERSION }}-debug-apk
          path: CaseOpener-New-2.0-v*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned APK in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          FILE="CaseOpener-New-2.0-v${APP_VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --title "CaseOpener New 2.0 - $TAG" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" "$FILE" --title "CaseOpener New 2.0 - $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
