name: Publish downloadable CS2 JSON catalog
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-cs2-json.yml
      - data/cs2/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout catalog files
        uses: actions/checkout@v4
      - name: Validate catalog and prepare files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("data/cs2/skins.json")
          items=json.loads(path.read_text(encoding="utf-8"))
          print("skins.json entries:",len(items))
          assert isinstance(items,(list,dict)) and path.stat().st_size > 100_000, "Missing/invalid skins catalog"
          PY
          mkdir -p bundle
          cp data/cs2/skins.json bundle/skins.json
          cd bundle
          zip -9 ../CS2_Skins_JSON.zip skins.json
      - name: Add download files to current release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.0.009 \
            bundle/skins.json \
            CS2_Skins_JSON.zip \
            --clobber
